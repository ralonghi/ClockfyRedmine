name: Sync Clockify to Redmine

on:
  schedule:
    # Roda todos os dias às 8:58 UTC (05:58 Horário de Brasília)
    - cron: '58 8 * * *'
  workflow_dispatch: # Permite o disparo manual no painel

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4   # <--- Atualizado para v4

      - name: Configurar Python
        uses: actions/setup-python@v5 # <--- Atualizado para v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Sincronização
        env:
          PYTHONIOENCODING: "utf-8"  # <--- FORÇA UTF-8 NO CONSOLE
          REDMINE_URL: ${{ secrets.REDMINE_URL }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
          CLOCKIFY_WORKSPACE_ID: ${{ secrets.CLOCKIFY_WORKSPACE_ID }}
          DEFAULT_REDMINE_ACTIVITY_ID: ${{ secrets.DEFAULT_REDMINE_ACTIVITY_ID }}
        run: python main.py